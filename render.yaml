services:
  - type: web
    name: zyvora-api
    env: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zyvora/api build
    startCommand: pnpm --filter @zyvora/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CLIENT_WEB_URL
        value: http://localhost:3000
      - key: ADMIN_WEB_URL
        value: https://admin.example.com
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
